services:
  api:
    build: .
    image: market-pulse-api:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MP_CACHE_BACKEND: redis
      MP_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
